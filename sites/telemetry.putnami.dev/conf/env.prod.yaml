# Non-secret production config for the anonymous CLI-usage telemetry receiver.
# Published to the control plane by `putnami publish`;
# the workload resolves this tree at boot.
#
# EVERY field declared in schema/config.json must have a value here — the
# platform rejects a deploy whose config is missing a declared key — so new
# fields are listed with an explicit empty string rather than omitted.
#
# Deliberately absent: the database connection. It arrives through the managed
# binding for the "telemetry" datasource (see infra/requirements.json) — a DSN is
# a credential and must never live in non-secret config.
receiver:
  # Base URL of the collector accepted telemetry is re-emitted to, for the raw
  # short-retention stream. The daily aggregates are the durable product of this
  # pipeline; the raw stream is debugging output. The collector is a fact of one
  # deployment, so it stays empty here: the receiver then re-emits to the
  # standard OTEL_EXPORTER_OTLP_ENDPOINT that the deploying platform sets. With
  # neither, re-emit is off: the receiver still accepts and still folds every
  # record into the daily aggregates.
  collectorEndpoint: ""

  # Comma-separated proxy addresses/CIDRs whose X-Forwarded-For may be believed.
  # Empty is the fail-safe default — the direct peer is used as the rate-limit
  # key, which over-throttles behind a shared ingress but never honours a
  # forgeable header. Set the platform ingress CIDR to get true per-client limits.
  trustedProxies: ""

  # Admission limits (see receiver.go): per client IP, and per instance.
  perIpPerMinute: 600
  globalQps: 100

  # Private aggregate read contract. These three keys are the whole
  # authentication configuration of GET /v1/cli-usage/aggregate:
  #
  #   aggregateAudience — the exact "aud" the caller's token must carry
  #   aggregateIssuer   — the OIDC issuer whose JWKS signs it, and the exact "iss"
  #   aggregateCallers  — comma-separated allowlist of caller subjects/emails
  #
  # ALL THREE must be set for the route to answer. Any empty value means
  # the route is disabled: it stays mounted and denies every request with 401,
  # authenticated or not. It never opens — there is no "no auth configured, allow
  # everyone" state. Anonymous POST /v1/logs is unaffected by these keys.
  #
  # The caller allowlist names the reading workloads of one deployment, so the
  # deploying platform supplies it as TELEMETRY_AGGREGATE_CALLERS; until it does,
  # the route stays closed.
  aggregateAudience: "https://telemetry.putnami.dev"
  aggregateIssuer: "https://accounts.google.com"
  aggregateCallers: ""
