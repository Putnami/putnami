# Configuration shared by every environment of putnami.dev.
#
# Secrets never live here. `analytics.secret` is declared `Sensitive` by the
# plugin, so the build lists it in infra/requirements.json and the deployment's
# control plane is what supplies the value.
analytics:
  # Off unless an environment turns it on. Collection needs two things a
  # laptop does not have: the managed Postgres holding the four analytics
  # tables, and the server-side key the daily visitor hash is computed with —
  # without which the plugin refuses to start, because a hash with no rotating
  # key anonymises nothing.
  #
  # `false` registers nothing at all: no middleware, no ingest route, no
  # migration. `putnami serve` therefore renders the site exactly as production
  # does, minus the measurement.
  #
  # To exercise collection locally: run a Postgres, put its binding and a key
  # of 32 characters or more in `conf/.env.local.yaml` (gitignored), and set
  # this to true there.
  enabled: false
