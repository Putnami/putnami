# Deployed configuration for putnami.dev, read by `putnami publish` for the
# `prod` environment (the file name must match the environment name the
# platform deploys to; nothing reads `.env.production.yaml`).
#
# Every field declared in schema/config.json without a default must have a
# value here — the platform rejects a deploy whose config is missing a
# declared key — so optional fields are listed with an explicit empty string.
#
# Everything here is public. The two values the site cannot serve without —
# the database binding and `analytics.secret` — are declared as requirements in
# infra/requirements.json and resolved by the control plane at boot.
analytics:
  enabled: true

  # No edge in front of the service sets a country header; empty stores no
  # country. There is no GeoIP lookup.
  countryHeader: ""

  # The connection reaches the container through the platform's front end, so
  # the socket peer is the same address for every visitor. Left unset, the
  # visitor hash and the ingest rate limit would both key on it: one "unique
  # visitor" a day for the whole site, and a single 120-request budget shared
  # by everyone.
  #
  # Only ranges that are not routable from the internet are listed, so no
  # external client can present one as its own peer and have its
  # `X-Forwarded-For` believed. A peer outside them keeps the safe behaviour:
  # the header is ignored and the socket address is used.
  #
  # Verify after the first deploy: an `analytics_daily_visitor` count stuck at
  # 1 means the front end's address is not in this list.
  trustedProxies:
    - 169.254.0.0/16
    - 127.0.0.1
    - ::1
