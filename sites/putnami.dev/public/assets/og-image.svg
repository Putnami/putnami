<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<title>Putnami environment preview</title>
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" style="stop-color:#0d1117" />
			<stop offset="100%" style="stop-color:#161b22" />
		</linearGradient>
	</defs>

	<!-- Background -->
	<rect width="1200" height="630" fill="url(#bg)" />

	<!-- Terminal window -->
	<rect x="100" y="120" width="1000" height="340" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1" />

	<!-- Terminal header -->
	<rect x="100" y="120" width="1000" height="40" rx="12" fill="#21262d" />
	<rect x="100" y="148" width="1000" height="12" fill="#21262d" />

	<!-- Window controls -->
	<circle cx="130" cy="140" r="6" fill="#f85149" />
	<circle cx="154" cy="140" r="6" fill="#f0b429" />
	<circle cx="178" cy="140" r="6" fill="#3fb950" />

	<!-- Terminal title -->
	<text
		x="600"
		y="145"
		font-family="ui-monospace, SF Mono, Menlo, monospace"
		font-size="14"
		fill="#8b949e"
		text-anchor="middle"
	>
		putnami — zsh
	</text>

	<!-- Terminal content -->
	<text x="130" y="200" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#8b949e">$</text>
	<text x="155" y="200" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#e6edf3">
		putnami serve my-app
	</text>

	<text x="130" y="245" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#3fb950">✓</text>
	<text x="160" y="245" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#8b949e">
		Branch:
	</text>
	<text x="260" y="245" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#e6edf3">
		feat/new-feature
	</text>

	<text x="130" y="290" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#3fb950">✓</text>
	<text x="160" y="290" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#8b949e">
		Environment:
	</text>
	<text x="310" y="290" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#e6edf3">ready</text>

	<text x="130" y="335" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#3fb950">✓</text>
	<text x="160" y="335" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#8b949e">URL:</text>
	<text x="220" y="335" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" fill="#58a6ff">
		https://feat-new-feature.my-app.putnami.app
	</text>

	<text x="130" y="395" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" fill="#6e7681">
		# Same structure locally and remotely. One branch, one environment.
	</text>

	<!-- Tagline -->
	<text
		x="600"
		y="540"
		font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
		font-size="32"
		font-weight="600"
		fill="#e6edf3"
		text-anchor="middle"
	>
		Your branch is already an environment.
	</text>

	<text
		x="600"
		y="585"
		font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
		font-size="20"
		fill="#8b949e"
		text-anchor="middle"
	>
		putnami.dev
	</text>
</svg>
