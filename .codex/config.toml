# Repository defaults for Codex. Callers may raise the Astra reasoning effort,
# but Putnami workflows must not switch away from the exact Astra model.
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
review_model = "gpt-6-astra"

[features]
multi_agent = true

[agents."fix-heavy"]
description = "GPT-6 Sol implementation worker for high-risk fixes involving invariants, security, concurrency, or protocols."
config_file = "agents/fix-heavy.toml"

[agents."fix-standard"]
description = "GPT-6 Sol implementation worker for settled slices, mechanical changes included, following established repository patterns."
config_file = "agents/fix-standard.toml"

[agents."reviewer"]
description = "Read-only GPT-6 Astra reviewer: the independent check of a frozen candidate, and the second round on P1 and P2 fixes."
config_file = "agents/reviewer.toml"

[agents."prune-triage"]
description = "Read-only GPT-6 Astra triage worker for /audit --prune: apply / verdict / drop per removal candidate, against every consumer repository."
config_file = "agents/prune-triage.toml"

[agents."prune-apply"]
description = "GPT-6 Luna edit worker for /audit --prune: applies one typology of prescribed removals and runs the --projects gate."
config_file = "agents/prune-apply.toml"
