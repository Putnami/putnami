# The test database CI provides: contributor CI runs a Postgres service on
# 127.0.0.1:6432 (role, password and database `test`). `putnami test` hands
# this binding to the suites when it provisioned none, with the run's mode:
# require on CI, so a suite fails when the server does not answer, and auto
# on a developer run, where a suite is skipped and named in the summary.
# A database `putnami test` provisions locally, from infra/requirements.json,
# wins over it.
databaseTest:
  protocolVersion: 1
  databases:
    default:
      engine: postgres
      schema: public
      connection:
        host: 127.0.0.1
        port: 6432
        database: test
        user: test
        password: test
        ssl: false
