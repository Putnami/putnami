# Pull request title — the breaking marker survives the squash.
#
# This repository merges by squash, and the squash commit is the pull request
# title and body: the commits of the branch are dropped. `putnami version` and
# the API checks of `validate` read the breaking marker ("!" or a
# "BREAKING CHANGE:" footer) from the commits on main, so a marker that only a
# branch commit carries is lost at merge. The breaking change then ships as a
# patch, and the next `validate` on main fails with no commit able to clear it.
#
# `putnami version check` fails when a commit of the branch declares a breaking
# change and the squash message does not, and names the commit.
name: Pull request title

# `edited` is what the gate in contributor-ci.yml does not listen to: a title
# or a body changes without a push. A draft runs nothing, as there.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  breaking-marker:
    name: the title carries the breaking marker of its commits
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The check reads every commit between the target branch and HEAD.
          fetch-depth: 0

      # `./putnamiw` builds the CLI from this workspace's source, on the exact
      # workspace Go version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      # The title and the body reach the shell through the environment, never
      # through the script text: a pull request from a fork writes both.
      #
      # The body is passed because the repository squashes with the pull
      # request body (squash_merge_commit_message: PR_BODY), so a footer in it
      # is in the commit `putnami version` reads. Drop --body-file if that
      # setting changes.
      - name: Check the breaking marker
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > "$RUNNER_TEMP/pull-request-body.md"
          ./putnamiw version check --base "origin/$BASE_REF" --title "$TITLE" \
            --body-file "$RUNNER_TEMP/pull-request-body.md"
