# Temporary benchmark of the credential-free gate. Not for main.
name: CI bench (temporary)
on:
  push:
    branches: [fdumay/ci-bench]
permissions:
  contents: read
  packages: read
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: put-test-nocov, kind: put, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: '--all --no-coverage' }
          - { name: put-cli-nocov, kind: put, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: '--projects @putnami/cli --no-coverage' }
          - { name: raw-test-one, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test-one, args: '' }
          - { name: raw-test-permod, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test-permod, args: '' }
          - { name: raw-test-permod-coverpkg, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test-permod-coverpkg, args: '' }
          - { name: raw-cli-cover, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: cli-cover, args: '' }
          - { name: raw-cli-coverpkg, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: cli-coverpkg, args: '' }
          - { name: raw-lint-permod, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: lint-permod, args: '' }
          - { name: raw-build-one, kind: raw, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: build-one, args: '' }
    services:
      postgres:
        image: ghcr.io/putnami/putnami/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['6432:5432']
        options: >-
          --health-cmd "pg_isready --username test --dbname test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUTNAMI_CLOUD_TOKEN: ''
      PUTNAMI_CACHE_URL: ''
      PUTNAMI_CACHE_TOKEN: ''
      PUTNAMI_TOKEN: ''
      CONFIG_SERVER_URL: ''
      CONFIG_SERVER_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        if: matrix.kind == 'raw'
        with:
          path: bench-tools
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: nproc; free -g; df -h / | tail -1
      - name: Raw tools
        if: matrix.kind == 'raw'
        run: |
          GOCACHE="$RUNNER_TEMP/toolcache" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          GOCACHE="$RUNNER_TEMP/toolcache" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          GOCACHE="$RUNNER_TEMP/toolcache" go list -deps -test $(go list -m -f '{{.Path}}/...') > /dev/null || true
          go clean -cache
      - name: Install
        if: matrix.kind == 'put'
        run: /usr/bin/time -v -o "$RUNNER_TEMP/time-install.txt" ./putnamiw install
      - name: Cache off
        if: matrix.kind == 'put'
        run: |
          echo '{"enabled": false}' > .putnami/cache.json
      - name: Bench
        env:
          CMD: ${{ matrix.cmd }}
          ARGS: ${{ matrix.args }}
        run: |
          set +e
          vmstat -t 5 > "$RUNNER_TEMP/vmstat.txt" &
          VM=$!
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ matrix.kind }}" = raw ]; then
            export GOCACHE="$RUNNER_TEMP/gocache-run"
            /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" bench-tools/.github/bench/raw.sh "$CMD" > "$RUNNER_TEMP/out/run.log" 2>&1
          else
            /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" ./putnamiw "$CMD" $ARGS --continue-on-error --trace-profile "$RUNNER_TEMP/out/trace.json" > "$RUNNER_TEMP/out/run.log" 2>&1
          fi
          echo "exit=$?" >> "$RUNNER_TEMP/out/time.txt"
          kill $VM
          tail -n 40 "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/time.txt"
          cp -r .putnami/stats 2>/dev/null "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/vmstat.txt" "$RUNNER_TEMP/out/"
          find . -path ./node_modules -prune -o -name '*.json' -newer "$RUNNER_TEMP/vmstat.txt" -path '*test*' -print 2>/dev/null | head -50 > "$RUNNER_TEMP/out/newjson.txt"
          find . -path '*/.putnami/*' -name '*.jsonl' -newer go.work 2>/dev/null | head -50 >> "$RUNNER_TEMP/out/newjson.txt"
          cp -r .putnami/sessions "$RUNNER_TEMP/out/" 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench4-${{ matrix.name }}
          path: ${{ runner.temp }}/out
