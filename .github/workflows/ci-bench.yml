# Temporary benchmark of the credential-free gate. Not for main.
name: CI bench (temporary)
on:
  push:
    branches: [fdumay/ci-bench]
permissions:
  contents: read
  packages: read
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: s8-a, kind: ab, ref: 03034415ba065c5122d7ae1505c0bd1d53518b75, cmd: ab, args: 'cli-old-1 cli-new-1 cli-new-2 cli-old-2' }
          - { name: s8-b, kind: ab, ref: 03034415ba065c5122d7ae1505c0bd1d53518b75, cmd: ab, args: 'cli-new-1 cli-old-1 cli-old-2 cli-new-2' }
    services:
      postgres:
        image: ghcr.io/putnami/putnami/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['6432:5432']
        options: >-
          --health-cmd "pg_isready --username test --dbname test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUTNAMI_CLOUD_TOKEN: ''
      PUTNAMI_CACHE_URL: ''
      PUTNAMI_CACHE_TOKEN: ''
      PUTNAMI_TOKEN: ''
      CONFIG_SERVER_URL: ''
      CONFIG_SERVER_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          path: bench-tools
      - name: Move bench tools out of the workspace
        run: mv bench-tools "$RUNNER_TEMP/bench-tools"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: nproc; free -g; df -h / | tail -1
      - name: Raw tools
        if: matrix.kind == 'raw'
        run: |
          GOCACHE="$RUNNER_TEMP/toolcache" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          GOCACHE="$RUNNER_TEMP/toolcache" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          GOCACHE="$RUNNER_TEMP/toolcache" go list -deps -test $(go list -m -f '{{.Path}}/...') > /dev/null || true
          go clean -cache
      - name: Install
        if: matrix.kind != 'raw'
        run: /usr/bin/time -v -o "$RUNNER_TEMP/time-install.txt" ./putnamiw install
      - name: Cache off
        if: matrix.kind != 'raw'
        run: |
          echo '{"enabled": false}' > .putnami/cache.json
      - name: Bench
        env:
          CMD: ${{ matrix.cmd }}
          ARGS: ${{ matrix.args }}
          BASE_REF: 5665af96632cb0e49409178ee15326ce0a521e77
        run: |
          set +e
          vmstat -t 5 > "$RUNNER_TEMP/vmstat.txt" &
          VM=$!
          $RUNNER_TEMP/bench-tools/.github/bench/sample.sh "$RUNNER_TEMP/out/sample" &
          SP=$!
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ matrix.kind }}" = ab ]; then
            /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" $RUNNER_TEMP/bench-tools/.github/bench/ab-tests.sh "$RUNNER_TEMP/out" $ARGS > "$RUNNER_TEMP/out/run.log" 2>&1
          elif [ "${{ matrix.kind }}" = raw ]; then
            export GOCACHE="$RUNNER_TEMP/gocache-run"
            /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" $RUNNER_TEMP/bench-tools/.github/bench/raw.sh "$CMD" > "$RUNNER_TEMP/out/run.log" 2>&1
          else
            /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" ./putnamiw "$CMD" $ARGS --continue-on-error --trace-profile "$RUNNER_TEMP/out/trace.json" > "$RUNNER_TEMP/out/run.log" 2>&1
          fi
          echo "exit=$?" >> "$RUNNER_TEMP/out/time.txt"
          kill $VM $SP
          tail -n 40 "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/time.txt"
          cp -r .putnami/stats 2>/dev/null "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/vmstat.txt" "$RUNNER_TEMP/out/"
          find . -path ./node_modules -prune -o -name '*.json' -newer "$RUNNER_TEMP/vmstat.txt" -path '*test*' -print 2>/dev/null | head -50 > "$RUNNER_TEMP/out/newjson.txt"
          find . -path '*/.putnami/*' -name '*.jsonl' -newer go.work 2>/dev/null | head -50 >> "$RUNNER_TEMP/out/newjson.txt"
          cp -r .putnami/sessions "$RUNNER_TEMP/out/" 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench10-${{ matrix.name }}
          path: ${{ runner.temp }}/out
