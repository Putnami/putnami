# Temporary benchmark of the credential-free gate. Not for main.
name: CI bench (temporary)
on:
  push:
    branches: [fdumay/ci-bench]
permissions:
  contents: read
  packages: read
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: oct01-test, ref: f62604371da39d1acf1c67f8f2a10e3b6f1a856e, cmd: test, args: '--all --enforce-coverage' }
          - { name: oct13-test, ref: 711d2a7004e8cfed139bf6c8fb90319c4f12656d, cmd: test, args: '--all --enforce-coverage' }
          - { name: oct23-cli-verbose, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: '--projects @putnami/cli --test-json' }
          - { name: oct23-cli-compile-only, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: "--projects @putnami/cli --run ^$ --no-enforce-coverage" }
          - { name: oct23-clidocs-verbose, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: '--projects @putnami/cli-documents --test-json' }
          - { name: oct23-goext-cloudext-verbose, ref: cc79a82f592261bbc0af8b6ea7946c1f02b82c72, cmd: test, args: '--projects @putnami/go,@putnami/cloud-extension --test-json' }
          - { name: oct01-cli-verbose, ref: f62604371da39d1acf1c67f8f2a10e3b6f1a856e, cmd: test, args: '--projects @putnami/cli --test-json' }
    services:
      postgres:
        image: ghcr.io/putnami/putnami/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['6432:5432']
        options: >-
          --health-cmd "pg_isready --username test --dbname test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUTNAMI_CLOUD_TOKEN: ''
      PUTNAMI_CACHE_URL: ''
      PUTNAMI_CACHE_TOKEN: ''
      PUTNAMI_TOKEN: ''
      CONFIG_SERVER_URL: ''
      CONFIG_SERVER_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: nproc; free -g; df -h / | tail -1
      - name: Install
        run: /usr/bin/time -v -o "$RUNNER_TEMP/time-install.txt" ./putnamiw install
      - name: Cache off
        run: |
          echo '{"enabled": false}' > .putnami/cache.json
      - name: Bench
        env:
          CMD: ${{ matrix.cmd }}
          ARGS: ${{ matrix.args }}
        run: |
          set +e
          vmstat -t 5 > "$RUNNER_TEMP/vmstat.txt" &
          VM=$!
          mkdir -p "$RUNNER_TEMP/out"
          /usr/bin/time -v -o "$RUNNER_TEMP/out/time.txt" ./putnamiw "$CMD" $ARGS --continue-on-error --trace-profile "$RUNNER_TEMP/out/trace.json" > "$RUNNER_TEMP/out/run.log" 2>&1
          echo "exit=$?" >> "$RUNNER_TEMP/out/time.txt"
          kill $VM
          tail -n 40 "$RUNNER_TEMP/out/run.log"
          cat "$RUNNER_TEMP/out/time.txt"
          cp -r .putnami/stats "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/vmstat.txt" "$RUNNER_TEMP/out/"
          find . -path ./node_modules -prune -o -name '*.json' -newer "$RUNNER_TEMP/vmstat.txt" -path '*test*' -print 2>/dev/null | head -50 > "$RUNNER_TEMP/out/newjson.txt"
          find . -path '*/.putnami/*' -name '*.jsonl' -newer go.work 2>/dev/null | head -50 >> "$RUNNER_TEMP/out/newjson.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench2-${{ matrix.name }}
          path: ${{ runner.temp }}/out
