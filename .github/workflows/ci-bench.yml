# Temporary benchmark of the credential-free gate. Not for main.
name: CI bench (temporary)
on:
  push:
    branches: [fdumay/ci-bench]
permissions:
  contents: read
  packages: read
env:
  REF: 8225583be0d17c8ac5f116feb39116a02ec67a2a
  SHARDS: '6'
jobs:
  overlap:
    name: overlap-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: ghcr.io/putnami/putnami/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['6432:5432']
        options: >-
          --health-cmd "pg_isready --username test --dbname test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUTNAMI_CLOUD_TOKEN: ''
      PUTNAMI_CACHE_URL: ''
      PUTNAMI_CACHE_TOKEN: ''
      PUTNAMI_TOKEN: ''
      CONFIG_SERVER_URL: ''
      CONFIG_SERVER_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          path: bench-tools
      - name: Move bench tools out of the workspace
        run: mv bench-tools "$RUNNER_TEMP/bench-tools"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: nproc; free -g; df -h / | tail -1
      - name: Install
        run: ./putnamiw install
      - name: Per-test coverage
        run: |
          vmstat -t 5 > "$RUNNER_TEMP/vmstat.txt" &
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
            "$RUNNER_TEMP/bench-tools/.github/bench/overlap-shard.sh" ${{ matrix.shard }} "$SHARDS" "$RUNNER_TEMP/out/s${{ matrix.shard }}"
          cat "$RUNNER_TEMP/out/s${{ matrix.shard }}/shard-${{ matrix.shard }}.meta" "$RUNNER_TEMP/time.txt"
          cp "$RUNNER_TEMP/time.txt" "$RUNNER_TEMP/vmstat.txt" "$RUNNER_TEMP/out/s${{ matrix.shard }}/"
          ls "$RUNNER_TEMP/out/s${{ matrix.shard }}/cov" | grep -c '\.fail\.log$' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlap-s${{ matrix.shard }}
          path: ${{ runner.temp }}/out

  report:
    needs: overlap
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: actions/checkout@v5
        with:
          path: bench-tools
      - name: Move bench tools out of the workspace
        run: mv bench-tools "$RUNNER_TEMP/bench-tools"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: overlap-s*
          path: ${{ runner.temp }}/art
          merge-multiple: true
      - name: Report
        run: |
          cd "$RUNNER_TEMP/bench-tools/.github/bench/overlap-report"
          GOWORK=off go run . "$RUNNER_TEMP/art" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/report"
          cat "$RUNNER_TEMP/report/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: overlap-report
          path: ${{ runner.temp }}/report
