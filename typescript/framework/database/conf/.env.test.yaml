# FALLBACK ONLY — kept for one release while callers move to provisioned bindings.
#
# These fixed port-6432 datasource blocks are the *fallback* the tests use when
# no database test binding is provisioned: raw `bun test`, `go test`, and CI's
# 6432 Postgres service container all resolve their connections from here.
#
# Every block says 127.0.0.1, never localhost. Both Docker's `-p 6432:5432` and
# a GitHub Actions service container publish on IPv4 only, while localhost
# resolves to ::1 first on a GitHub runner — so a `localhost` datasource is
# refused there against a Postgres that is up and healthy. That mismatch is what
# made .github/workflows/contributor-ci.yml flake before its service container
# existed; keep the literal address.
#
# A provisioned `DATABASE_TEST_BINDINGS` ALWAYS wins over these blocks. Under
# `putnami test` the CLI test-infra planner provisions an ephemeral-port
# Postgres and injects `DATABASE_TEST_BINDINGS`; the database test provider
# (src/test-provider.ts) consumes it, creates isolated databases, and pins the
# resulting runtime binding via setDatabaseBindingOverride — which the factory's
# resolveDatabaseBinding ranks ABOVE this file's config (override > config
# section > DATABASE_BINDINGS env > this file). So an ephemeral binding overrides
# the 6432 blocks without deleting them.
#
# DEPRECATION INTENT: these hardcoded blocks are retained for exactly one release
# so the un-provisioned paths keep working; remove them once every test path
# derives its datasources from a provider binding.
#
# Every block below is one datasource of the SAME physical database, so they
# share one physical connection pool (see doc/adr/0003) and must declare the
# same pool tuning: `maxLifetime: 5` is repeated on each block because
# `.env.yaml` declares it on some of them and a datasource that disagreed would
# be refused with a tuning-mismatch error instead of silently opening a second
# pool.
database:
  sql-test:
    type: postgres
    host: 127.0.0.1
    port: 6432
    database: test
    user: test
    password: test
    maxLifetime: 5
  clamp-test:
    type: postgres
    host: 127.0.0.1
    port: 6432
    database: test
    user: test
    password: test
    maxLifetime: 5
