# Configuration shared by every environment of this sample.
#
# The visitor hash needs a server-side key; analytics() fails closed without
# one, whatever the environment — `putnami qualify --target local` runs the
# sample production-mode. This is a sample-only placeholder, never reused
# anywhere else: a real workload keeps its key out of the tree
# (`conf/.secrets.<env>.yaml`, or the secret source of its deployment).
analytics:
  secret: sample-only-secret-do-not-reuse-0123456789
