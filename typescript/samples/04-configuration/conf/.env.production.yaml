app:
  name: "Config Sample"
  version: "1.0.0"
  debug: false
  features:
    enableCache: true
    enableMetrics: true

database:
  primary:
    host: db-primary.internal
    port: 5432
    name: production
    user: app
    # Secret — never commit a literal. Sourced from $DATABASE_PRIMARY_PASSWORD.
    password: ""
  replica:
    host: db-replica.internal
    port: 5432
    name: production
    user: reader
    # Secret — never commit a literal. Sourced from $DATABASE_REPLICA_PASSWORD.
    password: ""

api:
  weather:
    baseUrl: "https://api.weather.example.com"
    # Secret — never commit a literal. Sourced from $WEATHER_API_KEY.
    apiKey: ""
    timeout: 5000
    retries: 3
