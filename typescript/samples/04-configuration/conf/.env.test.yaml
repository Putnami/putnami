app:
  name: "Config Sample (Test)"
  version: "1.0.0"
  debug: false
  features:
    enableCache: true
    enableMetrics: true

database:
  primary:
    host: localhost
    port: 5432
    name: test_db
    user: test
    # Secret — never commit a literal. Sourced from $DATABASE_PRIMARY_PASSWORD.
    password: ""
  replica:
    host: localhost
    port: 5432
    name: test_db
    user: test
    # Secret — never commit a literal. Sourced from $DATABASE_REPLICA_PASSWORD.
    password: ""

api:
  weather:
    baseUrl: "https://mock.weather.test"
    # Secret — never commit a literal. Sourced from $WEATHER_API_KEY.
    apiKey: ""
    timeout: 1000
    retries: 1
