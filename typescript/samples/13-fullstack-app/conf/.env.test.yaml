database:
  default:
    host: localhost
    port: 6543
    database: fullstack_db
    user: postgres
    password: postgres
# The visitor hash key comes from `conf/.env.yaml`, shared by every environment.
analytics:
  # No opportunistic sweep during the assertions: a delete running inside an
  # ingest would race the counts the test reads back.
  retentionMode: off
  # Writes are asynchronous. A minute-long flush period keeps the assertions
  # deterministic: a row lands when the test calls `flushAnalytics()`, or when
  # the application stops — which is what the drain-on-stop proof needs.
  flushIntervalMs: 60000
