# The pipeline of the gitlab.com catalog project putnami/observe, copied there
# as .gitlab-ci.yml by release.sh. Its source, tests and docs live in
# github.com/Putnami/putnami under tooling/observe/gitlab.
#
# A pipeline for an X.Y.Z tag creates the release of that tag with the release
# keyword, which publishes the version to the GitLab CI/CD catalog. The
# Releases API would not publish it. No other pipeline runs a job.
stages:
  - release

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
  script:
    - echo "Releasing $CI_COMMIT_TAG of $CI_PROJECT_PATH to the CI/CD catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: Release $CI_COMMIT_TAG of the Putnami observe component.
