# server.port is a bare placeholder (declared, but no value) — a required scalar
# left blank must still surface as missing. server.host carries a value, and the
# database.primary object is satisfied by having a committed child, so neither is
# flagged.
server:
  port:
  host: "0.0.0.0"
database:
  primary:
    url: "postgres://db.internal:5432/app"
