name: epic
description: Run a coherent epic on one integration branch and draft-to-ready proposal, with proportionate planning, local proof, and final review
model: claude-opus-5-5[1m]
allowed-tools: Bash, Read, Grep, Glob, Edit, Write, TodoWrite, Skill, Agent, ToolSearch, mcp__putnami__putnami_search, mcp__putnami__putnami_symbol, mcp__putnami__putnami_context, mcp__putnami__putnami_impact, mcp__putnami__putnami_related, mcp__putnami__putnami_summary, mcp__putnami__list_projects, mcp__putnami__describe_project, mcp__putnami__deps, mcp__putnami__find_owner, mcp__putnami__why_impacted, mcp__putnami__topo_sort, mcp__putnami__impacted, mcp__putnami__get_diagnostics
argument-hint: <epic-task> [--skip-refine] [--refine-only] [--resume] [--sub-prs] [--max <n>] [--tier <light|standard|heavy>] [--no-analyst] [--dry-run]
disable-model-invocation: true
